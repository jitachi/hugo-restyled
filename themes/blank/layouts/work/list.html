{{ define "main" }}
  <main class="shell">
    <header class="list-head">
      <p class="eyebrow eyebrow--accent">Selected</p>
      <h1>{{ .Title }}</h1>
    </header>
    <ul class="work-list">
      {{ range where .Pages "Section" "work" }}
        {{ $p := . }}
        <li>
          <div class="work-head">
            <div>
              <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
              <p>{{ .Summary }}</p>
            </div>
            <time class="eyebrow" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006" }}</time>
          </div>
          {{ with .Resources.GetMatch .Params.featured_image }}
            <a class="frame" href="{{ $p.RelPermalink }}"><img alt="" src="{{ .RelPermalink }}" loading="lazy" /></a>
          {{ end }}
        </li>
      {{ end }}
    </ul>
  </main>
{{ end }}
