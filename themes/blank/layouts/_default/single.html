{{ define "main" }}
  <main class="shell">
    <article>
      <header class="post-head">
        <div class="eyebrow">
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
          {{ with .Params.category }}<span aria-hidden="true">/</span><span class="eyebrow--accent">{{ . }}</span>{{ end }}
          {{ if gt .ReadingTime 1 }}<span aria-hidden="true">/</span><span>{{ .ReadingTime }} min read</span>{{ end }}
        </div>
        <h1 class="post-title">{{ .Title }}</h1>
      </header>

      <div class="long-form">
        {{ .Content }}
      </div>

      <footer class="post-foot">
        <a class="back-link" href="{{ "/" | relURL }}">&larr; All writing</a>
        {{ with .Params.tags }}
          <ul id="tags">
            {{ range . }}
              <li><a href="{{ "/tags/" | relLangURL }}{{ . | urlize }}">{{ . }}</a></li>
            {{ end }}
          </ul>
        {{ end }}
      </footer>
    </article>
  </main>
{{ end }}
