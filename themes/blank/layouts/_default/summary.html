<li class="index-row" data-category="{{ .Params.category }}">
  <a href="{{ .RelPermalink }}">
    <span class="index-title">
      {{ .Title }}
      {{ with .Params.summary }}<span class="index-summary">{{ . | markdownify }}</span>{{ end }}
    </span>
    <span class="index-meta">
      <time class="eyebrow" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 02 2006" }}</time>
      {{ with .Params.category }}<span class="eyebrow eyebrow--accent">{{ . }}</span>{{ end }}
    </span>
    {{ with .Params.featured_image }}
      {{ with $.Resources.GetMatch . }}
        <span class="index-thumb"><img src="{{ .RelPermalink }}" alt="" loading="lazy" /></span>
      {{ end }}
    {{ end }}
  </a>
</li>
