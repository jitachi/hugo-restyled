{{ define "main" }}
  <main class="shell">
    <header class="list-head">
      {{ with .Title }}<h1>{{ . }}</h1>{{ end }}
      {{ with .Content }}<div class="long-form">{{ . }}</div>{{ end }}
    </header>
    <ol class="index">
      {{ range .Paginator.Pages }}{{ .Render "summary" }}{{ end }}
    </ol>
    {{ partial "pagination.html" . }}
  </main>
{{ end }}
