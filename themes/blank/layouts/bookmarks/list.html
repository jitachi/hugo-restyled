{{ define "main" }}
  <main class="shell">
    <header class="list-head">
      <p class="eyebrow eyebrow--accent">Saved</p>
      <h1>{{ .Title }}</h1>
    </header>
    {{ $paginator := .Paginate (where .Site.RegularPages "Type" "bookmarks") }}
    <ul class="bookmark-list">
      {{ range $paginator.Pages }}
        <li>
          <h2>{{ .Title }}</h2>
          <p>{{ .Summary }}</p>
          {{ .Content }}
        </li>
      {{ end }}
    </ul>
    {{ partial "pagination.html" . }}
  </main>
{{ end }}
