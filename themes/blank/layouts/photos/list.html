{{ define "main" }}
  <main class="shell">
    <header class="list-head">
      <p class="eyebrow eyebrow--accent">Leica, mostly</p>
      <h1>{{ .Title }}</h1>
    </header>
    <ul class="photo-grid">
      {{ range where .Pages "Section" "photos" }}
        <li>
          <a href="{{ .RelPermalink }}">
            <figure>
              <div class="frame">
                {{ with .Resources.GetMatch .Params.featured_image }}
                  <img alt="" src="{{ .RelPermalink }}" loading="lazy" />
                {{ end }}
              </div>
              <figcaption>
                <span class="eyebrow">{{ .Title }}</span>
                <time class="eyebrow" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2006" }}</time>
              </figcaption>
            </figure>
          </a>
        </li>
      {{ end }}
    </ul>
  </main>
{{ end }}
