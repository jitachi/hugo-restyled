<header>
  <div class="glass-container">
    <!-- Sliding underline indicator (driven by the nav script in baseof) -->
    <div class="nav-indicator"></div>

    <a class="logo" href="{{ "/" | relURL }}" aria-label="{{ .Site.Title }}" data-nav-item>
      <img src="{{ "img/avatar.png" | relURL }}" alt="" />
    </a>

    <nav class="nav-links" aria-label="Main">
      {{ $currentPage := . }}
      {{ range .Site.Menus.main }}
        <a
          class="{{ if or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) }}active{{ end }}"
          href="{{ .URL | relURL }}"
          title="{{ .Title }}"
          data-nav-item
          >{{ .Name }}</a
        >
      {{ end }}
    </nav>
  </div>

  {{ partial "theme-switcher.html" }}
</header>
